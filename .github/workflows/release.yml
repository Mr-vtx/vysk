name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: vysk.linux-x64-gnu.node

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vysk.win32-x64-msvc.node

          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: vysk.darwin-x64.node

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vysk.darwin-arm64.node

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      - name: Install dependencies
        run: npm install

      - name: Build native addon (release)
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Verify the binary actually loads on this OS
        shell: bash
        run: node -e "require('./index.js'); console.log('native binding for ${{ matrix.target }} loaded OK')"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload napi loader files (once)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: napi-loader
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place binaries and loader at package root
        run: |
          find artifacts -name "*.node" -exec cp {} . \;
          cp artifacts/napi-loader/index.js artifacts/napi-loader/index.d.ts .
          ls -la *.node index.js index.d.ts

      - name: Install deps and build TS
        run: |
          npm install
          npm run build:ts

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Smoke-test the packed tarball
        run: |
          npm pack --ignore-scripts
          mkdir /tmp/smoke
          cd /tmp/smoke
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE"/vysk-*.tgz
          node -e "require('vysk'); console.log('package loads OK')"

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}